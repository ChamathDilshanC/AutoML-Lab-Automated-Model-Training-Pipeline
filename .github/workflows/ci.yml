name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest

  # The default test run uses SQLite. This one runs the same suite against a real PostgreSQL, the
  # database used in production, including the migrations (backend/tests/test_migrations.py).
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automl
          POSTGRES_PASSWORD: automl-ci
          POSTGRES_DB: automl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automl -d automl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://automl:automl-ci@localhost:5432/automl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test on PostgreSQL
        run: pytest

  # Builds the production image and checks that it starts in each role without any AWS account.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --tag automl-backend:ci backend
      - name: Application imports cleanly inside the image
        run: >-
          docker run --rm --entrypoint python automl-backend:ci
          -c "import app.main, worker.main, app.migrate; print('ok')"
      - name: Runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id automl-backend:ci -u)" != "0"
      - name: Production refuses SQLite
        run: |
          if docker run --rm -e ENVIRONMENT=production -e SECRET_KEY=0123456789abcdef0123456789abcdef0123 \
               automl-backend:ci migrate; then
            echo "::error::A production container started without a PostgreSQL configuration."
            exit 1
          fi
      - name: The API serves /health
        run: |
          docker run --detach --name api --publish 8000:8000 automl-backend:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

  # Lints every workflow file, including deploy.yml, which CI cannot otherwise run.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      # No frontend test framework is configured yet.
      - name: Build
        run: npm run build

  # Runs the real Terraform on the runner, because it is not installed on every developer machine.
  # Nothing here needs AWS credentials and nothing is created: `-backend=false` and `validate`
  # only read the files and the provider's schema.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -diff -recursive
      - name: Init (no backend, no credentials)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
