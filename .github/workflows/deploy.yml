name: Deploy

# Builds the backend image, pushes it to ECR and rolls out the API (Lambda) and the worker
# (ECS Fargate) whenever main changes. AWS is reached with a short-lived OIDC token: there are no
# AWS keys in this repository or in GitHub secrets (docs/ADR/0006, docs/DEPLOYMENT.md).
#
# Nothing happens until the repository variable DEPLOY_ENABLED is "true", so merging this file does
# not try to deploy to an account that has not been set up. The other variables come from
# `terraform output github_variables`. The job also waits for the "production" environment's
# approval rules, if you add any.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Deploys never overlap or cancel each other half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      API_FUNCTION_NAME: ${{ vars.API_FUNCTION_NAME }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
    steps:
      - name: Check configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=""
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY API_FUNCTION_NAME ECS_CLUSTER ECS_WORKER_SERVICE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing. See docs/DEPLOYMENT.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-deploy-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Lambda accepts only a single-platform image manifest, so no provenance attestation, which
      # would turn the push into a multi-manifest index.
      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            --provenance=false \
            --tag "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            --tag "$REGISTRY/$ECR_REPOSITORY:latest" \
            backend

      # The image must at least start and import the application before anything is deployed.
      - name: Smoke-test image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker run --rm --entrypoint python "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            -c "import app.main, worker.main, app.migrate; print('image imports cleanly')"

      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      # The API applies database migrations itself when a Lambda instance starts, so there is no
      # separate migration step to forget; the smoke test below starts the first one.
      # Every call that returns the function's configuration is limited with --query: the
      # configuration includes its environment variables, and two of them hold secret values.
      - name: Deploy API (Lambda)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws lambda update-function-code \
            --function-name "$API_FUNCTION_NAME" \
            --image-uri "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            --query LastUpdateStatus --output text

      - name: Wait for the API deployment
        run: |
          if ! aws lambda wait function-updated --function-name "$API_FUNCTION_NAME"; then
            reason=$(aws lambda get-function-configuration \
              --function-name "$API_FUNCTION_NAME" \
              --query LastUpdateStatusReason --output text)
            echo "::error::The Lambda update did not finish: $reason"
            exit 1
          fi

      - name: Deploy worker (ECS)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --force-new-deployment \
            --query service.serviceName --output text

      # With the worker's desired count at 0 (the default) there is nothing to wait for.
      - name: Wait for the worker
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_WORKER_SERVICE"

      # The first request starts a new instance (imports, migrations), hence the long timeout.
      - name: Smoke-test the API
        run: |
          url=$(aws lambda get-function-url-config \
            --function-name "$API_FUNCTION_NAME" \
            --query FunctionUrl --output text)
          for _ in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 60 "${url%/}/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::The API did not answer /health after the deployment."
          exit 1
