[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-lab-backend"
version = "0.1.0"
description = "FastAPI service, ML engine and training worker for AutoML Lab."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*", "automl*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
packages = ["app", "automl", "worker"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "joblib.*"]
ignore_missing_imports = true
