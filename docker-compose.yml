# Local development only. Not a production deployment definition.
services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: local
      DATABASE_URL: sqlite:////data/automl.db
      ARTIFACT_DIR: /data/artifacts
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/data

  # Separate process from the API: it polls the shared database for queued experiments.
  worker:
    build: ./backend
    command: python -m worker.main
    environment:
      ENVIRONMENT: local
      DATABASE_URL: sqlite:////data/automl.db
      ARTIFACT_DIR: /data/artifacts
    volumes:
      - ./backend:/app
      - backend-data:/data

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  backend-data:
